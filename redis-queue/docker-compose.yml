services:
  producer:
    container_name: producer
    command: node dist/producer.main.js
    ports:
      - "3000:3000"
    restart: always
    build:
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
    depends_on:
      - redis
    env_file:
      - .env

  consumer:
    container_name: consumer
    command: node dist/consumer.main.js
    build:
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
    depends_on:
      - redis
    env_file:
      - .env

  redis:
    container_name: redis
    image: redis
    ports:
      - 6379:6379
