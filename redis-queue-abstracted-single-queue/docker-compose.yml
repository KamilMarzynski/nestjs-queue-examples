services:
  producer:
    container_name: producer
    command: npm run start:producer
    ports:
      - "3000:3000"
    restart: always
    build:
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
    depends_on:
      - redis
    env_file:
      - .env.producer

  consumer:
    container_name: consumer
    command: npm run start:consumer
    build:
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
    depends_on:
      - redis
    env_file:
      - .env.consumer

  redis:
    container_name: redis
    image: redis
    ports:
      - 6379:6379
